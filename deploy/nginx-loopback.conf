# Receives traffic only from the local Solid HTTPS tunnel.
# The tunnel terminates TLS externally; enforce its protocol at this trusted hop.
server {
    listen 127.0.0.1:3000;
    server_name easymanage-2y6bf83.solid.site;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host easymanage-2y6bf83.solid.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host easymanage-2y6bf83.solid.site;
        # The tunnel is the only caller. Do not trust user-supplied client IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
