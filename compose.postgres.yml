# Local/staging foundation only. Supply a unique password outside git.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: easymanage
      POSTGRES_DB: easymanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - easymanage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easymanage -d easymanage"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  easymanage_pgdata:
